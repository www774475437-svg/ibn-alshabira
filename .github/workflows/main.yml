name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --org com.ibnalshabira --project-name ibn_alshabira --platforms android .

      - name: Patch Android (app name)
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ibn-alshabira-apk
          path: build/app/outputs/flutter-apk/app-release.apk
