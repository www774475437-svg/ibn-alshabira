name: Quiz and counts for the site (4 times a day)
on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
    # Every half hour: only looks whether the sheikh pressed «أرسل الأسئلة الآن».
    - cron: '*/30 * * * *'
    # «بطولة الجمعة» (9 pm Mecca = 18:00 UTC): its card just before, its record just after.
    - cron: '23 17 * * 5'
    - cron: '41 18 * * 5'
  workflow_dispatch:
concurrency:
  group: media-branch-stats
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Get the media branch
        run: git clone --depth 1 --branch media "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" media
      - uses: actions/checkout@v4
        with:
          path: code
          sparse-checkout: tool
      - name: Copy the quiz and the counts out of Firestore
        working-directory: media
        env:
          CHECK_ONLY: ${{ github.event.schedule == '*/30 * * * *' && '1' || '0' }}
        run: python3 -I ../code/tool/build_stats.py
      - name: Readers' public pages and the staff list of members
        if: github.event.schedule != '*/30 * * * *'
        working-directory: media
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 -I ../code/tool/members.py
      - name: Save
        run: |
          [ -f media/quiz.json ] || [ -f media/profiles.json ] || [ -f media/recbooks.json ] || exit 0
          cd media && git status --porcelain | grep -q . || exit 0
          cd ..
          mkdir out && for f in quiz.json stats.json views.json usage.json stats-state.json leaders.json friday.json profiles.json tours.json daily.json recbooks.json; do if [ -f media/$f ]; then cp media/$f out/; fi; done
          for i in 1 2 3; do
            rm -rf m && git clone --depth 1 --branch media "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" m
            cp out/* m/ && cd m
            git config user.name "stats-bot"
            git config user.email "stats-bot@users.noreply.github.com"
            git add $(ls ../out)
            git diff --cached --quiet && exit 0
            git commit -q -m "Quiz and counts"
            git push origin HEAD:media && exit 0
            cd ..
          done
          exit 1
