name: Probe audio channel
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import urllib.request, re
          req = urllib.request.Request('https://t.me/s/QaidSandVe', headers={'User-Agent': 'Mozilla/5.0'})
          b = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          print('len', len(b))
          for c in ['tgme_widget_message_voice', 'tgme_widget_message_document', 'tgme_widget_message_audio', '<audio', '.ogg', '.mp3', 'tgme_widget_message_text', 'data-post=']:
              print(c, b.count(c))
          print(re.findall(r'data-post="([^"]+)"', b)[:3], re.findall(r'data-post="([^"]+)"', b)[-3:])
          i = b.find('tgme_widget_message_document')
          if i < 0: i = b.find('voice')
          print(re.sub(r'\s+', ' ', b[max(0, i-600):i+1800]))
          P
