name: Probe books
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 1gNr7Up7YaGfqWFfvIpXymRK6WepKUV42 1AVo3vPvo5Kn4BFXY9sWnlmgCuGdkOR6- 1RGqSTGyYgPcox7VRJsc4KniVW7kqumAw; do
            echo "== $id"
            curl -sL -o /tmp/b.pdf -w "%{http_code} %{content_type} %{size_download}\n" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            head -c 8 /tmp/b.pdf; echo; head -c 300 /tmp/b.pdf | tr -d '\0' | head -c 300; echo
          done
