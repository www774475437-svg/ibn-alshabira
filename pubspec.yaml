name: ibn_alshabira
description: "تطبيق ابن الشابرة — فتاوى ومقالات وكتب الشيخ قائد بن غانم الشابرة"
publish_to: 'none'
version: 1.13.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  just_audio: ">=0.9.40 <0.11.0"
  youtube_player_iframe: ">=5.1.0 <6.0.0"
  share_plus: ^10.1.4
  http: ^1.2.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  pdfrx: ^2.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.0.0
  cloud_firestore: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0A2417"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icon/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf
