<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="أجوبة ومقالات وكتب ورسائل الشيخ قايد بن غانم الشابرة حفظه الله، مرتبة على أبواب العقيدة والفقه والآداب، مع البحث بالموضوع.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and

    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ابن الشابرة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ابن الشابرة — أجوبة الشيخ قايد بن غانم الشابرة</title>
  <link rel="manifest" href="manifest.json">
  <meta property="og:title" content="ابن الشابرة — أجوبة الشيخ قايد بن غانم الشابرة">
  <meta property="og:description" content="أجوبة ومقالات وكتب ورسائل الشيخ قايد بن غانم الشابرة حفظه الله، مرتبة على أبواب العقيدة والفقه والآداب، مع البحث بالموضوع.">
  <meta property="og:image" content="https://ibnalshabira.com/icons/Icon-512.png">
  <meta property="og:url" content="https://ibnalshabira.com/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <style>
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: #1F5E3B; z-index: 9; transition: opacity .4s; }
    #loading img { width: 132px; height: 132px; border-radius: 50%; animation: pulse 1.6s ease-in-out infinite; }
    #loading p { color: #fff; font: 16px sans-serif; margin-top: 22px; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .8; } }
  </style>
  <div id="loading"><img src="icons/Icon-192.png" alt=""><p>جارٍ فتح «ابن الشابرة»…</p></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading');
      if (l) { l.style.opacity = 0; setTimeout(function () { l.remove(); }, 450); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
